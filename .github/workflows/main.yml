name: npm-publish
on:
  release:
    types: [published]
  workflow_dispatch:

# trusted publishing: npm exchanges the GitHub OIDC token for a short-lived publish token, no NPM_AUTH_TOKEN secret
permissions:
  id-token: write
  contents: read
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test
        run: bun run test
      - name: Build
        run: bun run build
      - name: Check the built package (ESM + CJS, one copy of every class)
        run: bun run test:dist
      - run: npm publish --access public
        # verbose: npm reports a failed OIDC token exchange only at this level
        env:
          NPM_CONFIG_LOGLEVEL: verbose
