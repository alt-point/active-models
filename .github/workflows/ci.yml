name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: Test
        run: yarn test
      - name: Build
        run: yarn build
